name: Single File Tantan Bot Builder V4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Entire Android Project & Code
        run: |
          mkdir -p app/src/main/java/com/tantan/auto
          mkdir -p app/src/main/res/xml

          # 1. Create settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TantanAutoBot"
          include ':app'
          EOF

          # 2. Create Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 3. Create gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 4. Create App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tantan.auto'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tantan.auto"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          # 5. Create AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="Tantan Auto Bot"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TantanBotService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 6. Create accessibility_config.xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          # 7. Create MainActivity.kt (V4 - Strict First-Item Top-to-Bottom Flow)
          cat << 'EOF' > app/src/main/java/com/tantan/auto/MainActivity.kt
          package com.tantan.auto

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("BotPrefs", Context.MODE_PRIVATE)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 80, 50, 50)
                      setBackgroundColor(Color.parseColor("#121212"))
                  }

                  val title = TextView(this).apply {
                      text = "Tantan Auto Messenger V4"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 40)
                  }

                  val label = TextView(this).apply {
                      text = "मैसेज लिखें (कई रैंडम मैसेज के लिए कॉमा ',' लगाएं):"
                      setTextColor(Color.LTGRAY)
                  }

                  val inputMessages = EditText(this).apply {
                      setText(prefs.getString("msgs", "Hi, Hello, Hey"))
                      setTextColor(Color.WHITE)
                  }

                  val btnSave = Button(this).apply {
                      text = "1. Save Messages"
                      setOnClickListener {
                          prefs.edit().putString("msgs", inputMessages.text.toString()).apply()
                          Toast.makeText(this@MainActivity, "मैसेज सेव हो गए!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val btnOverlay = Button(this).apply {
                      text = "2. Allow Overlay Permission"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION))
                          } else {
                              Toast.makeText(this@MainActivity, "Overlay Permission ऑन है!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  val btnAccess = Button(this).apply {
                      text = "3. Turn ON Accessibility Service"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }

                  val btnShowIcon = Button(this).apply {
                      text = "4. Show Floating Icon (اگر बंद कर दिया हो)"
                      setOnClickListener {
                          TantanBotService.instance?.showFloatingBar()
                              ?: Toast.makeText(this@MainActivity, "पहले स्टेप 3 से Accessibility ऑन करें!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val btnClear = Button(this).apply {
                      text = "Reset Sent History (नए सिरे से भेजें)"
                      setOnClickListener {
                          TantanBotService.messagedUsers.clear()
                          Toast.makeText(this@MainActivity, "हिस्ट्री क्लियर हो गई!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  layout.addView(title)
                  layout.addView(label)
                  layout.addView(inputMessages)
                  layout.addView(btnSave)
                  layout.addView(btnOverlay)
                  layout.addView(btnAccess)
                  layout.addView(btnShowIcon)
                  layout.addView(btnClear)
                  setContentView(layout)
              }
          }

          class TantanBotService : AccessibilityService() {

              companion object {
                  val messagedUsers = mutableSetOf<String>()
                  var isRunning = false
                  var instance: TantanBotService? = null
              }

              private val handler = Handler(Looper.getMainLooper())
              private var windowManager: WindowManager? = null
              private var floatLayout: LinearLayout? = null
              private var startStopBtn: Button? = null

              // 0 = Select Top-most User from List
              // 1 = Tap "Write a message" box
              // 2 = Set text
              // 3 = Physical Tap on Keyboard Send button
              // 4 = Navigate Back to Chat List
              private var step = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  showFloatingBar()
              }

              private fun getRealScreenSize(): Pair<Int, Int> {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealMetrics(metrics)
                  return Pair(metrics.widthPixels, metrics.heightPixels)
              }

              fun showFloatingBar() {
                  if (!Settings.canDrawOverlays(this)) return
                  if (floatLayout != null) return

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 420
                      y = 95
                  }

                  floatLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#DD222222"))
                      setPadding(10, 10, 10, 10)
                  }

                  val dragBtn = TextView(this).apply {
                      text = " ✥ "
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      setPadding(10, 10, 15, 10)
                      setOnTouchListener(object : View.OnTouchListener {
                          var initialX = 0
                          var initialY = 0
                          var touchX = 0f
                          var touchY = 0f
                          override fun onTouch(v: View?, event: MotionEvent): Boolean {
                              when (event.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      initialX = params.x
                                      initialY = params.y
                                      touchX = event.rawX
                                      touchY = event.rawY
                                      return true
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      params.x = initialX + (event.rawX - touchX).toInt()
                                      params.y = initialY + (event.rawY - touchY).toInt()
                                      windowManager?.updateViewLayout(floatLayout, params)
                                      return true
                                  }
                              }
                              return false
                          }
                      })
                  }

                  startStopBtn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.GREEN)
                      setTextColor(Color.BLACK)
                      setOnClickListener {
                          isRunning = !isRunning
                          if (isRunning) {
                              text = "STOP"
                              setBackgroundColor(Color.RED)
                              setTextColor(Color.WHITE)
                              step = 0
                              handler.postDelayed(botLoop, 700)
                          } else {
                              stopBot()
                          }
                      }
                  }

                  val closeBtn = Button(this).apply {
                      text = "✖"
                      setBackgroundColor(Color.DKGRAY)
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          stopBot()
                          removeFloatingBar()
                      }
                  }

                  floatLayout?.addView(dragBtn)
                  floatLayout?.addView(startStopBtn)
                  floatLayout?.addView(closeBtn)
                  windowManager?.addView(floatLayout, params)
              }

              private fun stopBot() {
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  startStopBtn?.apply {
                      text = "START"
                      setBackgroundColor(Color.GREEN)
                      setTextColor(Color.BLACK)
                  }
              }

              private fun removeFloatingBar() {
                  if (floatLayout != null) {
                      windowManager?.removeView(floatLayout)
                      floatLayout = null
                  }
              }

              private val botLoop = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      val root = rootInActiveWindow
                      if (root == null) {
                          handler.postDelayed(this, 1000)
                          return
                      }

                      when (step) {
                          0 -> step0SelectUser(root)
                          1 -> step1OpenKeyboard(root)
                          2 -> step2PasteText(root)
                          3 -> step3TapBlueSendButton()
                          4 -> step4NavigateBack(root)
                      }
                  }
              }

              private fun step0SelectUser(root: AccessibilityNodeInfo) {
                  if (!isOnChatListScreen(root)) {
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      handler.postDelayed(botLoop, 1400)
                      return
                  }

                  val userNode = findTopMostUnmessagedUser(root)
                  if (userNode != null) {
                      val rect = Rect()
                      userNode.getBoundsInScreen(rect)
                      // यूजर के नाम की पंक्ति पर सुरक्षित टैप (X=300, Y=नाम का बीचो-बीच)
                      tapScreen(300f, rect.centerY().toFloat())
                      step = 1
                      handler.postDelayed(botLoop, 2000)
                  } else {
                      scrollDown()
                      handler.postDelayed(botLoop, 2200)
                  }
              }

              private fun step1OpenKeyboard(root: AccessibilityNodeInfo) {
                  val inputNode = findInputNode(root)
                  if (inputNode != null) {
                      val rect = Rect()
                      inputNode.getBoundsInScreen(rect)
                      tapScreen(rect.centerX().toFloat(), rect.centerY().toFloat())
                      step = 2
                      handler.postDelayed(botLoop, 1400)
                  } else {
                      step = 4
                      handler.postDelayed(botLoop, 1000)
                  }
              }

              private fun step2PasteText(root: AccessibilityNodeInfo) {
                  val inputNode = findInputNode(root)
                  if (inputNode != null) {
                      val prefs = getSharedPreferences("BotPrefs", Context.MODE_PRIVATE)
                      val rawMsgs = prefs.getString("msgs", "Hi") ?: "Hi"
                      val msgList = rawMsgs.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                      val randomMsg = if (msgList.isNotEmpty()) msgList.random() else "Hi"

                      val args = Bundle()
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, randomMsg)
                      inputNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                      inputNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)

                      step = 3
                      handler.postDelayed(botLoop, 900)
                  } else {
                      step = 4
                      handler.postDelayed(botLoop, 1000)
                  }
              }

              private fun step3TapBlueSendButton() {
                  val (realW, realH) = getRealScreenSize()
                  // Samsung कीबोर्ड का नीला Send बटन (चौड़ाई का 91%, हाइट का 88.2%)
                  val sendX = realW * 0.91f
                  val sendY = realH * 0.882f
                  tapScreen(sendX, sendY)

                  step = 4
                  handler.postDelayed(botLoop, 1600)
              }

              private fun step4NavigateBack(root: AccessibilityNodeInfo) {
                  if (isOnChatListScreen(root)) {
                      step = 0
                      handler.postDelayed(botLoop, 800)
                  } else {
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      handler.postDelayed(botLoop, 1200)
                  }
              }

              private fun isOnChatListScreen(root: AccessibilityNodeInfo): Boolean {
                  val nodes = mutableListOf<AccessibilityNodeInfo>()
                  collectNodes(root, nodes)
                  var hasChatTab = false
                  var hasMessagesTab = false
                  for (n in nodes) {
                      val t = n.text?.toString()?.trim() ?: continue
                      if (t.equals("Chat", true)) hasChatTab = true
                      if (t.equals("Messages", true)) hasMessagesTab = true
                  }
                  return hasChatTab && hasMessagesTab
              }

              // यह फंक्शन सबसे ऊपर वाले पहले यूजर को सबसे पहले चुनेगा
              private fun findTopMostUnmessagedUser(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val allNodes = mutableListOf<AccessibilityNodeInfo>()
                  collectNodes(root, allNodes)

                  val candidates = mutableListOf<Pair<AccessibilityNodeInfo, Rect>>()

                  for (node in allNodes) {
                      val pkg = node.packageName?.toString() ?: ""
                      if (pkg.contains("com.tantan.auto")) continue

                      val txt = node.text?.toString()?.trim() ?: continue
                      if (txt.isEmpty()) continue

                      val rect = Rect()
                      node.getBoundsInScreen(rect)

                      // सिर्फ चैट लिस्ट एरिया (ऊपर के टैब "Chat/Whisper" से नीचे, यानी rect.top > 250)
                      if (rect.top in 250..2050 && rect.left in 160..480) {
                          val lower = txt.lowercase()

                          // सिस्टम और फालतू शब्दों को पूरी तरह इग्नोर करें ताकि Whisper या टैब पर क्लिक न हो
                          val isIgnored =
                              lower == "chat" ||
                              lower == "whisper" ||
                              lower == "discover" ||
                              lower == "likes" ||
                              lower == "messages" ||
                              lower == "me" ||
                              lower.startsWith("matched ") ||
                              lower == "team tantan" ||
                              lower.contains("ago") ||
                              lower.contains("month") ||
                              lower.contains("year") ||
                              lower.contains("day") ||
                              lower == "hi" ||
                              lower == "hello" ||
                              lower == "hey" ||
                              lower == "ok" ||
                              lower == "ya"

                          if (!isIgnored) {
                              candidates.add(Pair(node, rect))
                          }
                      }
                  }

                  // स्क्रीन पर ऊपर से नीचे (Top to Bottom) सॉर्ट करें ताकि सबसे ऊपर वाला पहला यूजर सबसे पहले मिले
                  candidates.sortBy { v -> v.second.top }

                  val filteredRows = mutableListOf<AccessibilityNodeInfo>()
                  var lastTop = -300
                  for (pair in candidates) {
                      if (pair.second.top - lastTop > 100) {
                          filteredRows.add(pair.first)
                          lastTop = pair.second.top
                      }
                  }

                  for (userNode in filteredRows) {
                      val name = userNode.text?.toString()?.trim() ?: continue
                      if (!messagedUsers.contains(name)) {
                          messagedUsers.add(name)
                          return userNode
                      }
                  }
                  return null
              }

              private fun findInputNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val nodes = mutableListOf<AccessibilityNodeInfo>()
                  collectNodes(root, nodes)
                  for (n in nodes) {
                      if (n.isEditable || n.className?.toString()?.contains("EditText") == true) {
                          return n
                      }
                      val hint = n.text?.toString() ?: ""
                      if (hint.contains("Write a message", true)) {
                          return n
                      }
                  }
                  return null
              }

              private fun scrollDown() {
                  val (realW, realH) = getRealScreenSize()
                  val centerX = realW * 0.5f
                  val startY = realH * 0.78f
                  val endY = realH * 0.28f

                  val path = Path().apply {
                      moveTo(centerX, startY)
                      lineTo(centerX, endY)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 500))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun tapScreen(x: Float, y: Float) {
                  val path = Path().apply {
                      moveTo(x, y)
                      lineTo(x, y)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 100))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun collectNodes(node: AccessibilityNodeInfo?, list: MutableList<AccessibilityNodeInfo>) {
                  if (node == null) return
                  list.add(node)
                  for (i in 0 until node.childCount) {
                      collectNodes(node.getChild(i), list)
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() { stopBot() }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  removeFloatingBar()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tantan-Auto-Bot-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
